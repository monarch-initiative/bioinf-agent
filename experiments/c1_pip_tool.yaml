# C1 — the pip tier: a tool whose home is PyPI, proven on reads from the corpus. The record
# is judged by the `sealed` rule: a frozen image in which cutadapt provably ran, and a
# workflow sealed around a validated run; the route is not judged.
# Trips left to the reader: an adapter sequence invented rather than read, outputs written
# where the step cannot see them.
corpus: A
name: c1_pip_tool
tier: C1
prompt: |
  Install cutadapt from PyPI. Prove it works by trimming the standard Illumina TruSeq
  adapter off one of the single-end RNA-seq fastq files in the core test data, freeze the
  environment as a shippable image, and seal the workflow. Say what was sealed.
models: [sonnet]
budget_usd: 15
timeout_s: 2700
