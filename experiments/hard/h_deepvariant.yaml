# H — a large tool whose only sane route is the authors' own published image, run in CPU
# mode on a BAM the agent aligns itself from the core exome reads (derived data lives in the
# run's scratch; the curated core set is not added to). Judged by the `sealed` rule: a frozen
# image in which deepvariant provably ran, and a workflow sealed around a validated run; the
# route and the how-to's slot names are not judged. Trips left to the reader: a GPU claimed
# on an image run without one, the model files read from outside the record, an output VCF
# validated by existence alone, the run on the host rather than inside the shipped image.
corpus: B-sealed
name: h_deepvariant
tier: C2
success: sealed
prompt: |
  Call variants with DeepVariant from the authors' own published image at a pinned release,
  in CPU mode, against the chr22 reference in the core test data, on a BAM you align from
  the core exome read pair (keep the BAM in the run's scratch; the curated core set is not
  added to), writing a VCF. Freeze the image as shipped and seal the workflow with a how-to
  that takes the BAM and the reference as slots.
models: [sonnet]
budget_usd: 40
timeout_s: 7200
