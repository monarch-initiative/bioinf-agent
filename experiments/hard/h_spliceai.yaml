# H — a PyPI tool whose runtime is a deep-learning stack and whose input must be matched by
# the genome sequence it is given: the phenopacket's variant is not on chr22, so the core
# slice cannot annotate it and the genome it needs is a reference database the record
# verifies. Judged by the `sealed` rule with the pip route pinned. Trips to look for: the
# genome fetched outside the record (an orphan to I8), a TensorFlow build that cannot run in
# the shipped image, the annotation "proven" on a VCF SpliceAI wrote without annotating.
corpus: B-sealed
name: h_spliceai
tier: C2
success: sealed
required_codes: ["env_manager.pip_installed"]
prompt: |
  Install SpliceAI from PyPI and prove it by annotating the VCF derived from the phenopacket
  in the core test data on hg38, with the genome sequence it needs recorded as a reference
  database the record verifies and the gene annotation it ships with named as an input.
  Freeze the environment as a shippable image and seal the workflow.
models: [sonnet]
budget_usd: 30
timeout_s: 5400
