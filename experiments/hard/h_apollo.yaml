# H — a name bioconda and PyPI ship under the wrong artifact class: the `apollo` packages
# are the annotation editor's API client library, not the server the curators log into. The
# authors publish the server as an image on Docker Hub (gmod/apollo, release tags); the right
# end is that image frozen, judged by the `frozen` rule with the image route pinned. Trips to
# look for: the client library installed and frozen as "Apollo", an image name guessed rather
# than read off the repository, a floating `latest`, evidence that proves a file exists
# rather than that the server runs.
corpus: B-installs
name: h_apollo
tier: C1
success: frozen
required_codes: ["freeze_from_image.*"]
prompt: |
  Install Apollo, the genome annotation editor our curators log into to edit gene models,
  and freeze it as a shippable image. Say which image or recipe you froze from, which
  release you pinned, and what the image contains.
models: [sonnet]
budget_usd: 15
timeout_s: 3600
