# H — a variant-prioritisation stack with a config file, reference bundles and the authors'
# own Dockerfile below the repository root (docker/Dockerfile, beside a private-cloud
# variant). The right route is the authors' recipe: clone at a pinned release, build their
# Dockerfile with any fix recorded as a patch, freeze that; judged by the `frozen` rule: a
# frozen image in which talos provably runs at least to an entry point's help. The route is
# not judged. The record names talos with a release as its version,
# with evidence that at least runs the command-line entry point's help (an import is not a
# run). Trips left to the reader: a conda reconstruction attempted first, the reference
# bundles downloaded "to be safe", a Dockerfile patched by hand and the result frozen as the
# authors'.
corpus: B-installs
name: h_talos
tier: C1
success: frozen
expect:
  evidence_depth_min: help
prompt: |
  Install Talos, the variant prioritisation tool from https://github.com/populationgenomics/talos,
  at its latest release, using the authors' own Dockerfile, and freeze it as a shippable image
  in which the talos command-line entry point runs. The reference bundles are not needed for
  this install. Say which release and which Dockerfile you built from.
models: [sonnet]
budget_usd: 30
timeout_s: 5400
