# C1 — a Java jar tool. Judged by the `sealed` rule: a frozen image in which picard provably
# ran, and a workflow sealed around a validated run; the route is not judged. Trips left to the reader:
# the jar fetched without a checksum, a how-to that hard-codes the jar's host path.
corpus: A
name: c1_jar
tier: C1
prompt: |
  Install Picard (the Java jar tool). Prove it by converting one of the single-end RNA-seq
  fastq files in the core test data to an unmapped BAM with FastqToSam, freeze the
  environment as a shippable image, and seal the workflow.
models: [sonnet]
budget_usd: 15
timeout_s: 2700
