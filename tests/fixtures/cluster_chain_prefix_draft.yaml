    ${gtf} > ${counts_ctrl2}; htseq-count -f bam -r pos -s no -t exon -i gene_id ${bam_ctrl3}
    ${gtf} > ${counts_ctrl3}; htseq-count -f bam -r pos -s no -t exon -i gene_id ${bam_treat1}
    ${gtf} > ${counts_treat1}; htseq-count -f bam -r pos -s no -t exon -i gene_id
    ${bam_treat2} ${gtf} > ${counts_treat2}; htseq-count -f bam -r pos -s no -t exon
