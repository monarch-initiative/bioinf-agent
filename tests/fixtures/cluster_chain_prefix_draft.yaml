pipeline_name: rnaseq_deseq2_chr22_cluster
description: "From a cluster drive: the two-step htseq-count \u2192 DESeq2 chain\
  \ run natively on an HPC cluster and SEALED, where step 2 consumes the remote DIRECTORY\
  \ step 1 wrote into. This is the shape that was unsealable before remote_outputs\
  \ + the I8 exact-parent directory match \u2014 step 2's input traced to nothing\
  \ because detected_outputs holds the downloaded LOCAL copies. Two frozen envs, chained\
  \ by digest."
pipeline_steps:
- tool: htseq_count
  purpose: cluster run of htseq_count
  command: htseq-count -f bam -r pos -s no -t exon -i gene_id ${bam_ctrl1} ${gtf}
