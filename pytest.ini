[pytest]
# Only ever collect the project's own suite. Without this, a bare `pytest` walks
# INTO on-disk conda envs under envs/ (e.g. envs/*/lib/python*/site-packages) and
# tries to import third-party test modules, producing hundreds of collection errors
# that have nothing to do with this codebase. CI already scopes to tests/; this makes
# the bare local invocation behave the same.
testpaths = tests

# Parallel by DEFAULT. The suite was ~98s wall on 31% CPU — two-thirds of the wait was
# process startup and blocking I/O, not computation, so the cores were sitting idle. A
# feedback loop slow enough to context-switch away from is one people stop running.
#
#   --dist loadgroup   honour @pytest.mark.xdist_group. Required, not cosmetic: two
#                      tests in tests/integration/correctness/test_n5_reaper_not_on_import.py
#                      share the real /tmp/bioinf_services and, split across workers,
#                      produce a failure that ACCUSES the code of a defect that did not
#                      happen. Without loadgroup the marker is silently ignored.
#
# Measured on a 14-core box: 98s -> 62s (hermetic guard, below) -> 28s (here).
# Small runs are not penalised — workers absorb collection in parallel, so a single
# file costs the same either way.
#
# Debugging a failure? `-n0` restores serial execution, real tracebacks and --pdb.
addopts = -n auto --dist loadgroup

markers =
    integration: end-to-end test that hits real functions with real (small) artifacts and no boundary mocking. Fast (<1s typical). Runs on every push.
    integration_docker: integration test that requires a live Docker daemon (env builds, biocontainer adopt). Slow on cold cache; near-instant on warm EnvCache hit. Opt-in.
    live: hits the REAL package registries (PyPI / anaconda.org / CRAN / Bioconductor / GitHub) over the network. Opt-in: `pytest -m live`. NOT in the fast tier — it is slow, it needs a network, and registry state moves under it. Mocking it away is not an option: the whole point is that PyPI really does normalise 1.0 -> 1.0.0, and a mocked version of that only asserts our fixtures agree with our fixtures.
