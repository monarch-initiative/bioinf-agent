pod5:
  # Raw nanopore signal (pod5) for basecaller pipelines — dorado / bonito /
  # remora. Whole-file, sha256-pinned. `chemistry` + `suggested_model` let a
  # downstream pipeline pick the base-caller model AND the paired modbase model
  # (5mC / 6mA / …) from dorado's registry — no additional declarations here.
  #
  # This entry is a SEED committed to the repo rather than a download:
  # `source_path` is repo-relative and the bootstrap serves it as a file:// URL.
  # It was derived from a CC0 source by scripts/derive_pod5_seed.py; the
  # sidecar next to it records the upstream tarball, member, byte hashes and
  # read ids. Public pod5 from Oxford Nanopore's own releases is CC BY-NC, which
  # is why the seed is derived from HPRC/GIAB data instead.
  - accession: HG002_PAM69552_R1041_5reads
    sample: HG002
    assay_type: ont_wgs
    platform: ont
    chemistry: dna_r10.4.1_e8.2_400bps_4khz
    flowcell: FLO-PRO114M
    kit: SQK-LSK114
    suggested_model: dna_r10.4.1_e8.2_400bps_hac@v4.1.0
    source_path: config/seed_data/pod5/HG002_PAM69552_R1041_5reads.pod5
    expected_size: 187216
    expected_sha256: 41afaffdda4b12cb527f102716726aeaf8cffd96d929d205c74b468225999cf4
    license: CC0-1.0
    citation: "Human Pangenome Reference Consortium (BioProject PRJNA730823) and NHGRI; Liao W-W et al., Nature 617:312 (2023); sample HG002/NA24385 from NIST Genome in a Bottle"
    description: >
      Five native HG002/NA24385 reads on R10.4.1 (FLO-PRO114M, SQK-LSK114,
      4 kHz, 400 bps) from the UCSC sheared-DNA PromethION run PAM69552
      (2022-10-04), subset from one fast5 in the HPRC open-data bucket
      (CC0 1.0). Basecallable with dna_r10.4.1_e8.2_400bps_hac@v4.1.0.
