# Canonical core test datasets — used by scripts/setup_core_test_data.sh.
#
# Adding a new entry here makes it part of the bootstrap; removing one removes
# it. The bootstrap script reads this file (not the script source) so changes
# to the canonical list don't touch any code.
#
# Fields per entry are passed directly to add_core_test_data():
#   accession   — SRA accession (or any identifier when source_url is set)
#   assay_type  — exome | wgs | rnaseq | chipseq | atacseq | hic | amplicon |
#                 wgbs | ont_wgs | pacbio_hifi | direct_rna | isoseq | fiberseq
#   end_type    — paired_end | single_end          (short-read only)
#   sample      — display sample id (used in output filenames)
#   platform    — illumina (default) | ont | pacbio_hifi | pacbio_isoseq | pacbio_fiberseq
#   subset      — 500 | 1K | 10K (default) | 50K | 100K | 500K | 1M
#   source_url  — override EBI SRA URL builder (NCBI FTP, S3, etc.)
#   source_url_r2 — R2 override for paired-end with source_url
#
# Every entry ALSO carries its terms of use, read by nothing at bootstrap and by
# tests/test_data_sources_credited.py at build time:
#   license     — the terms the upstream source publishes for these bytes
#                 (INSDC-unrestricted | CC0-1.0 | CC-BY-4.0 | BSD-3-Clause |
#                 public-domain | ENCODE-open)
#   citation    — who to cite or acknowledge when this dataset is used
# docs/data_sources.md is the human table; the test fails when an entry here
# has no row there, or lacks either field. Nothing in this repo redistributes
# the data — each user downloads it from the source at setup time.

