[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinf-agent"
version = "0.1.0"
description = "Installs bioinformatics tools into isolated conda envs, validates them INSIDE the image they ship, packages them as HPC-shippable containers, and emits a machine-verified spec."
readme = "README.md"
# The agent RUNTIME floor: the oldest interpreter the code is written for. The server
# runs on ./.conda_runtime, which scripts/setup.sh creates at 3.11 (matching CI) and
# start_mcp_server.sh insists on. Distinct from config/agent_config.yaml's
# python_version, which is the python of the tool environments the agent BUILDS.
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Aaron", email = "aaron@tislab.org" }]
keywords = ["bioinformatics", "conda", "docker", "reproducibility", "hpc", "mcp", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The single dependency truth: setup.sh and CI both install `-e ".[dev]"`. There is no
# requirements.txt mirror to keep in sync.
dependencies = [
    # <4: the server and background detachment are validated against fastmcp 3.x
    # (3.2.4). Raise the cap only with a validation pass against the next major.
    "fastmcp>=2.0,<4",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "conda-lock>=2.5",
    # The browser config menu (scripts/config_web.py). Both already arrive via
    # fastmcp; declared so the menu does not ride a transitive dependency that a
    # fastmcp major could silently drop.
    "starlette>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# pytest.ini hardcodes `-n auto --dist loadgroup`, so xdist is not optional for
# running the suite.
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
# The Globus wire (transfer_providers shells out to `globus`). Installed by
# setup.sh so the CLI is present before the first transfer needs it; the one
# thing it cannot prepackage is `globus login` — an interactive OAuth consent.
hpc = ["globus-cli>=3.30"]

[project.urls]
Homepage = "https://github.com/monarch-initiative/bioinf-agent"
Repository = "https://github.com/monarch-initiative/bioinf-agent"

# `python -m agent` is the canonical launch (routed through agent/__main__.py so the
# FastMCP app is loaded exactly once — see that file's docstring). This console
# script is the same entry point under a friendlier name.
[project.scripts]
bioinf-mcp = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["operator_instructions.md"]

# NOTE: this is a CHECKOUT-ROOTED service, not a site-packages library. It reads config/
# and the untracked envs/ and resources/ relative to the checkout (agent/skills/workspace.py
# resolves every path; what the agent produces lives in ~/bioinf_workspace) and runs on
# ./.conda_runtime. Install EDITABLE from the checkout, `pip install -e .`, which is what
# scripts/setup.sh does; a plain `pip install .` into site-packages would separate the code
# from config/ and the checkout zones. See README.md.
