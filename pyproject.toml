[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinf-agent"
version = "0.1.0"
description = "Installs bioinformatics tools into isolated conda envs, validates them INSIDE the image they ship, packages them as HPC-shippable containers, and emits a machine-verified spec."
readme = "README.md"
# The agent RUNTIME floor — the oldest interpreter the server is allowed to start on.
# What it actually runs on is ./.conda_runtime, which scripts/setup.sh creates at 3.11
# (and which CI matches); the floor stays at 3.10 for the ONE other reachable path,
# start_mcp_server.sh's legacy fallback to a base-conda python on machines provisioned
# before the runtime env existed. Both avoid the macOS system 3.9.
#
# This was the sentence documenting the pre-setup-contract world — "the agent is run on
# the miniforge base (3.10 today)" — and it was the ONLY place that assumption was
# written down, which is why cold-start finding CS2 cites it. The assumption is gone;
# setup.sh now owns the runtime env explicitly.
#
# Distinct from config/agent_config.yaml's python_version, which is the python of the
# tool-environments the agent BUILDS, not this process's.
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Aaron", email = "aaron@tislab.org" }]
keywords = ["bioinformatics", "conda", "docker", "reproducibility", "hpc", "mcp", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# THE single dependency truth. There used to be a requirements.txt mirror "kept in sync
# deliberately", from when the README's install line was `pip install -r`; nothing reads
# that file any more (setup.sh and CI both install `-e ".[dev]"`), and one truth in two
# places staying in sync by discipline is this repo's own diagnosed defect class — the
# fastmcp<4 pin below had to be applied twice. Deleted with the setup-contract pass.
dependencies = [
    # <4: the server + background detachment are proven against fastmcp 3.x
    # (3.2.4); 4.x is a major nobody here has validated. A fresh `pip install`
    # was resolving 4.0.3 and shipping new users an untested runtime. Raise the
    # cap only WITH a validation pass (cold-start finding, 2026-09-15).
    "fastmcp>=2.0,<4",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "conda-lock>=2.5",
]

[project.optional-dependencies]
# pytest.ini hardcodes `-n auto --dist loadgroup`, so xdist is not optional for
# running the suite — a [dev] without it made the README's own `pytest` line
# fail on a fresh install (cold-start follow-on to CS1).
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[project.urls]
Homepage = "https://github.com/monarch-initiative/bioinf-agent"
Repository = "https://github.com/monarch-initiative/bioinf-agent"

# `python -m agent` is the canonical launch (routed through agent/__main__.py so the
# FastMCP app is loaded exactly once — see that file's docstring). This console
# script is the same entry point under a friendlier name.
[project.scripts]
bioinf-mcp = "agent.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*"]

# NOTE: this is a WORKSPACE-ROOTED service, not a site-packages library. It reads and
# writes config/, data/, env_reports/, envs/, docker_images/, drafts/ relative to the
# repo root (agent/mcp_server.py resolves PROJECT_ROOT from the source tree). Install
# EDITABLE from the checkout — `pip install -e .` — and launch from the repo root. A
# plain `pip install .` into site-packages would relocate the code away from those
# runtime directories and config loading would fail. See README.md.
